---
- name: Fix Ceph apt sources
  copy:
    dest: /etc/apt/sources.list.d/ceph.list
    content: |
      # managed by Ansible
      deb http://download.proxmox.com/debian/ceph-quincy {{ ansible_distribution_release }} no-subscription
      deb http://download.proxmox.com/debian/ceph-reef {{ ansible_distribution_release }} no-subscription

- name: Add PVE no-subscription apt sources
  copy:
    dest: /etc/apt/sources.list.d/pve-no-subscription.list
    content: |
      # managed by ansible
      deb http://download.proxmox.com/debian/pve {{ ansible_distribution_release }} pve-no-subscription

- name: Comment out pve-enterprise sources
  replace:
    path: /etc/apt/sources.list.d/pve-enterprise.list
    regexp: '^(?!#)'
    replace: '#'

- name: Configure Debian apt sources
  copy:
    dest: /etc/apt/sources.list
    mode: 0644
    owner: root
    group: root
    content: |
      # managed by ansible - changes will be overwritten
      deb http://mirror.xmission.com/debian bookworm main contrib non-free non-free-firmware
      deb http://mirror.xmission.com/debian bookworm-updates main contrib non-free non-free-firmware
      # security updates
      deb http://security.debian.org bookworm-security main contrib non-free non-free-firmware

- name: Update apt cache
  apt:
    update_cache: yes

- name: Disable subscription nag
  notify: Reinstall proxmox-widget-toolkit
  copy:
    dest: /etc/apt/apt.conf.d/no-nag-script
    content: |
      # managed by Ansible
      DPkg::Post-Invoke { "dpkg -V proxmox-widget-toolkit | grep -q '/proxmoxlib\.js$'; if [ $? -eq 1 ]; then { echo 'Removing subscription nag from UI...'; sed -i '/.*data\.status.*{/{s/\!//;s/active/NoMoreNagging/}' /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js; }; fi"; };

- name: Set root password
  user:
    name: root
    update_password: always
    password: "{{ root_password_hash }}"
  become: true

- name: install additional packages
  apt:
    name:
      - vim
      - axel
      - nut-client
      - screen
    state: present
    update_cache: yes

- name: get CPU vendor
  shell: grep ^vendor_id /proc/cpuinfo | uniq | awk '{ print $3 }'
  register: cpu_vendor
  changed_when: false

- name: install AMD CPU microcode
  apt:
    name:
      - amd64-microcode
    state: present
    update_cache: yes
  when: cpu_vendor.stdout.find('AuthenticAMD') != -1

- name: install Intel CPU microcode
  apt:
    name:
      - intel-microcode
    state: present
    update_cache: yes
  when: cpu_vendor.stdout.find('GenuineIntel') != -1

- name: Check if local snippets are enabled
  shell: pvesm list local | grep -q ^local\:snippets
  register: pvesm_check
  failed_when: pvesm_check.rc == 2
  changed_when: pvesm_check.rc == 1

- name: Enable PVESM local snippets
  shell: pvesm set local -content snippets,iso,vztmpl,backup
  when: pvesm_check.rc == 1
  register: snippets_enable

- name: Wait for local snippets directory
  wait_for:
    path: /var/lib/vz/snippets
    timeout: 120

- name: Create /var/lib/vz/snippets/vendor.yaml
  copy:
    dest: /var/lib/vz/snippets/vendor.yaml
    # do NOT add any comments to the file, it will screw with cloud-init.
    content: |
      #cloud-config
      timezone: America/Denver
      package_update: true
      package_upgrade: true
      packages:
        - qemu-guest-agent
      runcmd:
          - touch /etc/cloud/cloud-init.disabled
          - sleep 1 && reboot

- name: install create_template.sh script
  copy:
    src: files/create_template.sh
    dest: /usr/local/bin/create_template.sh
    mode: 0700
    owner: root
    group: root

- name: configure /etc/nut/nut.conf for netclient mode
  notify: restart nut-client
  copy:
    dest: /etc/nut/nut.conf
    content: |
      MODE=netclient

- name: configure /etc/nut/upsmon.conf for monitor mode
  notify: restart nut-client
  copy:
    dest: /etc/nut/upsmon.conf
    content: |
      MINSUPPLIES 1
      SHUTDOWNCMD "/sbin/shutdown -h +0"
      POLLFREQ 5
      POLLFREQALERT 5
      HOSTSYNC 15
      DEADTIME 15
      POWERDOWNFLAG /etc/killpower
      RBWARNTIME 43200
      NOCOMMWARNTIME 300
      FINALDELAY 5
      MONITOR ups02@10.200.60.12 1 observer {{ lookup('community.general.onepassword', 'nut_observer', field='password', vault='Ansible') }} secondary

# bug: https://bugs.debian.org/cgi-bin/bugreport.cgi?bug=1056190
- name: Add cron job to restart nut-monitor hourly
  ansible.builtin.cron:
    name: restart nut-monitor hourly
    cron_file: restart_nutmonitor_hourly
    user: root
    minute: "0"
    hour: "*"
    job: "systemctl restart nut-monitor > /dev/null 2>&1"
